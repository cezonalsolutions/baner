<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Order Placed</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:"DM Sans", Arial, sans-serif;
    background:#ffffff;
    overflow:hidden;
}


/* =========================
   SCREEN
========================= */

.success-page{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff;
}


/* =========================
   CONTENT
========================= */

.success-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    /* BOTH CIRCLE + TEXT PUSHED UP */
    transform:translateY(-38px);
}


/* =========================
   ANIMATION AREA
========================= */

.success-animation{
    position:relative;

    width:260px;
    height:220px;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   GREEN CIRCLE
========================= */

.success-circle{
    position:relative;
    z-index:10;

    width:124px;
    height:124px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#16a34a;

    animation:circlePop 4s
        cubic-bezier(.22,.9,.32,1.15)
        infinite;
}


/* =========================
   CLEAN TICK
========================= */

.tick-svg{
    width:70px;
    height:70px;

    display:block;
    fill:none;
}

.tick-path{
    fill:none;

    stroke:#ffffff;
    stroke-width:5.5;

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:100;
    stroke-dashoffset:100;

    animation:tickDraw 4s ease infinite;
}


/* =========================
   BURST RINGS
========================= */

.ring{
    position:absolute;

    left:50%;
    top:50%;

    width:124px;
    height:124px;

    border:2px solid rgba(22,163,74,.23);
    border-radius:50%;

    opacity:0;

    animation:ringBurst 4s ease-out infinite;
}

.ring-two{
    border-color:rgba(22,163,74,.11);
    animation-delay:.08s;
}


/* =========================
   REAL 5 POINT STARS
========================= */

.star{
    position:absolute;

    left:50%;
    top:50%;

    width:16px;
    height:16px;

    z-index:5;

    opacity:0;

    background:#f5b82e;

    clip-path:polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 94%,
        50% 72%,
        21% 94%,
        32% 57%,
        2% 35%,
        39% 35%
    );

    animation:starBurst 4s ease-out infinite;
}


/* =========================
   STARS AROUND CIRCLE
========================= */

.s1{
    --x:0px;
    --y:-104px;

    width:19px;
    height:19px;
}

.s2{
    --x:70px;
    --y:-78px;

    width:13px;
    height:13px;

    animation-delay:.03s;
}

.s3{
    --x:104px;
    --y:-34px;

    width:17px;
    height:17px;

    animation-delay:.06s;
}

.s4{
    --x:111px;
    --y:15px;

    width:12px;
    height:12px;

    animation-delay:.02s;
}

.s5{
    --x:78px;
    --y:73px;

    width:18px;
    height:18px;

    animation-delay:.07s;
}

.s6{
    --x:10px;
    --y:104px;

    width:12px;
    height:12px;

    animation-delay:.04s;
}

.s7{
    --x:-72px;
    --y:76px;

    width:17px;
    height:17px;

    animation-delay:.08s;
}

.s8{
    --x:-110px;
    --y:16px;

    width:13px;
    height:13px;

    animation-delay:.03s;
}

.s9{
    --x:-103px;
    --y:-39px;

    width:17px;
    height:17px;

    animation-delay:.06s;
}

.s10{
    --x:-68px;
    --y:-82px;

    width:12px;
    height:12px;

    animation-delay:.01s;
}


/* =========================
   GREEN SMALL STARS
========================= */

.green-star{
    background:#68bf7a;
}

.s11{
    --x:42px;
    --y:-101px;

    width:10px;
    height:10px;

    animation-delay:.08s;
}

.s12{
    --x:105px;
    --y:48px;

    width:10px;
    height:10px;

    animation-delay:.04s;
}

.s13{
    --x:-35px;
    --y:104px;

    width:10px;
    height:10px;

    animation-delay:.09s;
}

.s14{
    --x:-108px;
    --y:-5px;

    width:9px;
    height:9px;

    animation-delay:.05s;
}

.s15{
    --x:-37px;
    --y:-103px;

    width:9px;
    height:9px;

    animation-delay:.02s;
}


/* =========================
   DOTS
========================= */

.dot{
    position:absolute;

    left:50%;
    top:50%;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#f1c65b;

    opacity:0;

    animation:dotBurst 4s ease-out infinite;
}

.d1{
    --x:90px;
    --y:-65px;
}

.d2{
    --x:108px;
    --y:67px;

    background:#72c585;
}

.d3{
    --x:43px;
    --y:108px;
}

.d4{
    --x:-91px;
    --y:68px;

    background:#72c585;
}

.d5{
    --x:-110px;
    --y:-60px;
}

.d6{
    --x:31px;
    --y:-110px;

    background:#72c585;
}


/* =========================
   ORDER TEXT
========================= */

.order-text{
    margin-top:-17px;

    font-size:30px;
    line-height:1.1;

    font-weight:700;

    letter-spacing:-0.7px;

    color:#18181b;

    animation:textShow 4s ease infinite;
}


/* =========================
   CIRCLE POP
========================= */

@keyframes circlePop{

    0%{
        opacity:0;
        transform:scale(.30);
    }

    8%{
        opacity:1;
        transform:scale(1.13);
    }

    13%{
        transform:scale(.96);
    }

    18%{
        transform:scale(1);
    }

    86%{
        opacity:1;
        transform:scale(1);
    }

    93%{
        opacity:0;
        transform:scale(.88);
    }

    100%{
        opacity:0;
        transform:scale(.30);
    }
}


/* =========================
   TICK DRAW
========================= */

@keyframes tickDraw{

    0%,
    9%{
        opacity:0;
        stroke-dashoffset:100;
    }

    12%{
        opacity:1;
    }

    23%{
        opacity:1;
        stroke-dashoffset:0;
    }

    86%{
        opacity:1;
        stroke-dashoffset:0;
    }

    93%,
    100%{
        opacity:0;
        stroke-dashoffset:0;
    }
}


/* =========================
   RING BURST
========================= */

@keyframes ringBurst{

    0%,
    9%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.7);
    }

    13%{
        opacity:.7;
    }

    33%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.95);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.95);
    }
}


/* =========================
   STAR BURST
========================= */

@keyframes starBurst{

    0%,
    10%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            translate(0,0)
            scale(0)
            rotate(0deg);
    }

    15%{
        opacity:1;
    }

    22%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--x) * .62),
                calc(var(--y) * .62)
            )
            scale(1.25)
            rotate(20deg);
    }

    31%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            translate(var(--x),var(--y))
            scale(1)
            rotate(55deg);
    }

    40%{
        opacity:.6;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--x) * 1.08),
                calc(var(--y) * 1.08)
            )
            scale(.7)
            rotate(80deg);
    }

    47%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--x) * 1.12),
                calc(var(--y) * 1.12)
            )
            scale(.25)
            rotate(100deg);
    }

    100%{
        opacity:0;
    }
}


/* =========================
   DOT BURST
========================= */

@keyframes dotBurst{

    0%,
    12%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(0);
    }

    18%{
        opacity:1;
    }

    30%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            translate(var(--x),var(--y))
            scale(1);
    }

    43%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--x) * 1.08),
                calc(var(--y) * 1.08)
            )
            scale(.25);
    }

    100%{
        opacity:0;
    }
}


/* =========================
   TEXT
========================= */

@keyframes textShow{

    0%,
    17%{
        opacity:0;

        transform:
            translateY(9px)
            scale(.97);
    }

    26%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

    86%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

    93%,
    100%{
        opacity:0;

        transform:
            translateY(4px)
            scale(.98);
    }
}

</style>
</head>

<body>

<div class="success-page">

    <div class="success-content">

        <div class="success-animation">

            <!-- BURST RINGS -->

            <div class="ring"></div>
            <div class="ring ring-two"></div>


            <!-- YELLOW STARS -->

            <span class="star s1"></span>
            <span class="star s2"></span>
            <span class="star s3"></span>
            <span class="star s4"></span>
            <span class="star s5"></span>
            <span class="star s6"></span>
            <span class="star s7"></span>
            <span class="star s8"></span>
            <span class="star s9"></span>
            <span class="star s10"></span>


            <!-- GREEN STARS -->

            <span class="star green-star s11"></span>
            <span class="star green-star s12"></span>
            <span class="star green-star s13"></span>
            <span class="star green-star s14"></span>
            <span class="star green-star s15"></span>


            <!-- DOTS -->

            <span class="dot d1"></span>
            <span class="dot d2"></span>
            <span class="dot d3"></span>
            <span class="dot d4"></span>
            <span class="dot d5"></span>
            <span class="dot d6"></span>


            <!-- SUCCESS CIRCLE -->

            <div class="success-circle">

                <svg
                    class="tick-svg"
                    viewBox="0 0 72 72"
                >
                    <path
                        class="tick-path"
                        d="M17 37 L29 48 L55 22"
                    />
                </svg>

            </div>

        </div>


        <div class="order-text">
            Order Placed
        </div>

    </div>

</div>

</body>
</html>
