<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#ffffff;
}

body{
    font-family:"DM Sans", Arial, sans-serif;
    color:#111111;
}


/* ===============================
   FIXED TOP
================================ */

.top-fixed{
    position:fixed;
    top:0;
    left:0;
    right:0;

    width:100%;
    height:99px;

    z-index:99999;

    background:#ffffff;

    border-bottom:1px solid #d8d8dc;
    box-shadow:none;
}


/* 35PX TOP SAFE AREA */

.safe-area{
    width:100%;
    height:35px;
    background:#ffffff;
}


/* ===============================
   HEADER
================================ */

.header{
    width:100%;
    height:64px;

    display:flex;
    align-items:center;

    gap:13px;

    padding:0 18px;

    background:#ffffff;
}


/* BACK */

.back{
    width:40px;
    height:40px;

    flex:0 0 40px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff;

    border:1px solid #e2e2e4;
    border-radius:50%;
}

.back svg{
    width:21px;
    height:21px;
}


/* TITLE */

.header-title{
    font-size:22px;
    line-height:1;

    font-weight:700;

    letter-spacing:-0.4px;

    color:#101012;
}


/* ===============================
   PAGE
================================ */

.page{
    width:100%;

    padding:
        124px
        max(18px, env(safe-area-inset-right))
        calc(35px + env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

    background:#ffffff;
}


/* ===============================
   USER
================================ */

.user{
    width:100%;

    display:flex;
    align-items:center;

    gap:15px;

    margin-bottom:27px;
}


.avatar{
    width:66px;
    height:66px;

    flex:0 0 66px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#f0eaff;
}

.avatar svg{
    width:37px;
    height:37px;

    stroke:#292331;
}


.user-content{
    min-width:0;
}


.name{
    margin-bottom:6px;

    font-size:22px;
    line-height:1.15;

    font-weight:700;

    letter-spacing:-0.4px;

    color:#101012;
}


.mobile{
    font-size:15px;

    font-weight:500;

    color:#5d5f65;

    letter-spacing:-0.1px;
}


/* ===============================
   TOP ACTIONS
================================ */

.actions{
    width:100%;

    display:grid;

    grid-template-columns:repeat(3,minmax(0,1fr));

    gap:10px;

    margin-bottom:36px;
}


.action{
    width:100%;
    height:112px;

    min-width:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:12px;

    padding:10px 5px;

    background:#ffffff;

    border:1px solid #e3e3e5;
    border-radius:15px;
}


.action svg{
    width:30px;
    height:30px;
}


.action span{
    font-size:14px;

    line-height:1.25;

    font-weight:600;

    letter-spacing:-0.15px;

    color:#151517;

    text-align:center;
}


/* ===============================
   SECTIONS
================================ */

.section{
    width:100%;
    margin-bottom:31px;
}


.section-title{
    margin-bottom:14px;

    font-size:19px;
    line-height:1.2;

    font-weight:700;

    letter-spacing:-0.3px;

    color:#111113;
}


/* ===============================
   LIST
================================ */

.list{
    width:100%;

    overflow:hidden;

    background:#ffffff;

    border:1px solid #e3e3e5;
    border-radius:16px;
}


/* ===============================
   ROW
================================ */

.row{
    width:100%;

    min-height:72px;

    display:flex;
    align-items:center;

    padding:0 17px;

    background:#ffffff;
}


.row-icon{
    width:45px;

    flex:0 0 45px;

    display:flex;
    align-items:center;
    justify-content:flex-start;
}


.row-icon svg{
    width:27px;
    height:27px;
}


.row-title{
    flex:1;

    min-width:0;

    font-size:15.5px;

    font-weight:600;

    letter-spacing:-0.15px;

    color:#151517;
}


.arrow{
    width:19px;
    height:19px;

    margin-left:10px;

    stroke:#64656a;
}


.line{
    height:1px;

    margin-left:62px;

    background:#eeeeef;
}


/* ===============================
   SVG
================================ */

svg{
    display:block;

    fill:none;

    stroke:#19191b;

    stroke-width:1.75;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* ===============================
   LOGOUT
================================ */

.logout{
    width:100%;
    height:57px;

    margin-top:7px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff;

    border:1px solid #dedee0;
    border-radius:15px;

    color:#111113;

    font-size:15.5px;
    font-weight:700;
}


/* ===============================
   VERSION
================================ */

.version{
    width:100%;

    padding-top:24px;

    text-align:center;

    font-size:13px;
    font-weight:500;

    color:#8b8c91;
}


/* ===============================
   SMALL MOBILE
================================ */

@media(max-width:360px){

    .header{
        padding-left:14px;
        padding-right:14px;
    }

    .page{
        padding-left:14px;
        padding-right:14px;
    }

    .actions{
        gap:7px;
    }

    .action{
        height:108px;
    }

    .action span{
        font-size:13px;
    }
}


/* ===============================
   TABLET / DESKTOP
================================ */

@media(min-width:768px){

    .header{
        padding-left:30px;
        padding-right:30px;
    }

    .page{
        padding-left:30px;
        padding-right:30px;
    }

    .actions{
        gap:14px;
    }
}

</style>
</head>

<body>


<!-- ===============================
     FIXED PROFILE HEADER
================================ -->

<div class="top-fixed">

    <div class="safe-area"></div>

    <header class="header">

        <div class="back">

            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6"/>
            </svg>

        </div>

        <div class="header-title">
            Profile
        </div>

    </header>

</div>


<!-- ===============================
     PAGE
================================ -->

<main class="page">


<!-- USER -->

<section class="user">

    <div class="avatar">

        <svg viewBox="0 0 24 24">

            <circle cx="12" cy="8" r="3.6"/>

            <path
                d="
                M5.5 20
                C6.2 15.9 8.5 14 12 14
                C15.5 14 17.8 15.9 18.5 20
                "
            />

        </svg>

    </div>


    <div class="user-content">

        <div class="name">
            Ram
        </div>

        <div class="mobile">
            +91 93477 68947
        </div>

    </div>

</section>


<!-- ===============================
     TOP ACTIONS
================================ -->

<section class="actions">


    <!-- ORDERS -->

    <div class="action">

        <svg viewBox="0 0 24 24">

            <path d="M5 8.5h14l1 11.5H4L5 8.5z"/>

            <path

                M8.5 9V6.8
                C8.5 4.7 9.9 3.5 12 3.5
                C14.1 3.5 15.5 4.7 15.5 6.8V9
                "
            />

        </svg>

        <span>Your Orders</span>

    </div>


    <!-- HELP -->

    <div class="action">

        <svg viewBox="0 0 24 24">

            <path
                d="
                M20 11.5
                C20 15.6 16.4 19 12 19
                C10.8 19 9.7 18.8 8.7 18.3
                L4 20
                L5.4 15.9
                C4.5 14.6 4 13.1 4 11.5
                C4 7.4 7.6 4 12 4
                C16.4 4 20 7.4 20 11.5z
                "
            />

            <path d="M8.5 11.5h.01"/>
            <path d="M12 11.5h.01"/>
            <path d="M15.5 11.5h.01"/>

        </svg>

        <span>Help &amp; Support</span>

    </div>


    <!-- COUPONS -->

    <div class="action">

        <svg viewBox="0 0 24 24">

            <path
                d="
                M4 7h16v3
                C18.5 10 17.5 10.9 17.5 12
                C17.5 13.1 18.5 14 20 14
                V17H4V14
                C5.5 14 6.5 13.1 6.5 12
                C6.5 10.9 5.5 10 4 10V7z
                "
            />

            <path d="M12 8.5v1"/>
            <path d="M12 11.5v1"/>
            <path d="M12 14.5v1"/>

        </svg>

        <span>Coupons</span>

    </div>

</section>


<!-- ===============================
     YOUR INFORMATION
================================ -->

<section class="section">

    <h2 class="section-title">
        Your Information
    </h2>


    <div class="list">


        <!-- SAVED ADDRESS -->

        <div class="row">

            <div class="row-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="
                        M12 21
                        C12 21 18 15.3 18 9.8
                        C18 6.5 15.3 4 12 4
                        C8.7 4 6 6.5 6 9.8
                        C6 15.3 12 21 12 21z
                        "
                    />

                    <circle cx="12" cy="9.8" r="2.1"/>

                </svg>

            </div>

            <div class="row-title">
                Saved Addresses
            </div>

            <svg class="arrow" viewBox="0 0 24 24">
                <path d="M9 6l6 6-6 6"/>
            </svg>

        </div>


        <div class="line"></div>


        <!-- PROFILE -->

        <div class="row">

            <div class="row-icon">

                <svg viewBox="0 0 24 24">

                    <circle cx="12" cy="12" r="9"/>

                    <circle cx="12" cy="9" r="3"/>

                    <path
                        d="
                        M6.8 18
                        C7.7 15.4 9.4 14 12 14
                        C14.6 14 16.3 15.4 17.2 18
                        "
                    />

                </svg>

            </div>

            <div class="row-title">
                Profile
            </div>

            <svg class="arrow" viewBox="0 0 24 24">
                <path d="M9 6l6 6-6 6"/>
            </svg>

        </div>


        <div class="line"></div>


        <!-- REWARDS -->

        <div class="row">

            <div class="row-icon">

                <svg viewBox="0 0 24 24">

                    <rect
                        x="4"
                        y="9"
                        width="16"
                        height="11"
                        rx="1.5"
                    />

                    <path d="M3 9h18V6H3v3"/>

                    <path d="M12 6v14"/>

                    <path
                        d="
                        M12 6
                        C9.2 6 7.2 5.3 7.2 3.8
                        C7.2 2.8 8 2.2 9 2.2
                        C10.7 2.2 12 4 12 6z
                        "
                    />

                    <path
                        d="
                        M12 6
                        C14.8 6 16.8 5.3 16.8 3.8
                        C16.8 2.8 16 2.2 15 2.2
                        C13.3 2.2 12 4 12 6z
                        "
                    />

                </svg>

            </div>

            <div class="row-title">
                Rewards
            </div>

            <svg class="arrow" viewBox="0 0 24 24">
                <path d="M9 6l6 6-6 6"/>
            </svg>

        </div>

    </div>

</section>


<!-- ===============================
     OTHER INFORMATION
================================ -->

<section class="section">

    <h2 class="section-title">
        Other Information
    </h2>


    <div class="list">


        <!-- SUGGEST PRODUCTS -->

        <div class="row">

            <div class="row-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="
                        M12 3
                        L14.4 8
                        L20 8.8
                        L16 12.7
                        L17 18.2
                        L12 15.6
                        L7 18.2
                        L8 12.7
                        L4 8.8
                        L9.6 8z
                        "
                    />

                </svg>

            </div>

            <div class="row-title">
                Suggest Products
            </div>

            <svg class="arrow" viewBox="0 0 24 24">
                <path d="M9 6l6 6-6 6"/>
            </svg>

        </div>


        <div class="line"></div>


        <!-- NOTIFICATIONS -->

        <div class="row">

            <div class="row-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="
                        M6 17h12
                        L16.5 15
                        V10.5
                        C16.5 7.7 14.7 6 12 6
                        C9.3 6 7.5 7.7 7.5 10.5
                        V15L6 17z
                        "
                    />

                    <path
                        d="
                        M10 19
                        C10.4 20.2 11 20.7 12 20.7
                        C13 20.7 13.6 20.2 14 19
                        "
                    />

                </svg>

            </div>

            <div class="row-title">
                Notifications
            </div>

            <svg class="arrow" viewBox="0 0 24 24">
                <path d="M9 6l6 6-6 6"/>
            </svg>

        </div>


        <div class="line"></div>


        <!-- GENERAL INFO -->

        <div class="row">

            <div class="row-icon">

                <svg viewBox="0 0 24 24">

                    <circle cx="12" cy="12" r="9"/>

                    <path d="M12 11v6"/>

                    <path d="M12 7.5h.01"/>

                </svg>

            </div>

            <div class="row-title">
                General Info
            </div>

            <svg class="arrow" viewBox="0 0 24 24">
                <path d="M9 6l6 6-6 6"/>
            </svg>

        </div>

    </div>

</section>


<!-- LOGOUT -->

<div class="logout">
    Log Out
</div>


<!-- VERSION -->

<div class="version">
    1.0.0
</div>


</main>

</body>
</html>
